name: Apex Sports Club CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------
  # Job 1: Static analysis & lint
  # ----------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql, xml, gd, zip
          tools: phpunit:9.6

      - name: PHP Lint (syntax check on all files)
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.freebuff/*' -not -path './.github/*' |
          xargs -I {} php -l {} 2>&1 | grep -v 'No syntax errors' || true

      - name: Check for hardcoded secrets
        run: |
          ! grep -rn 'sk_live_\|pk_live_\|SG\.\|AKIA' --include='*.php' --include='*.sql' --include='*.env*' . 2>/dev/null

  # ----------------------------------------------------------------
  # Job 1b: Security scans (secrets + SAST)
  # ----------------------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history for full-repo diff scanning

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST — Semgrep (PHP)
        uses: returntocorp/semgrep-action@v1
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_APP_DEPLOYMENT }}
          generateSarif: "1"
        # Note: if SEMGREP_APP_TOKEN is unset the action still runs a local
        # scan with the default ruleset (no findings published).

      - name: Dangerous patterns regression gate
        run: |
          set -e
          echo "Checking for newly introduced dangerous patterns…"
          # Fail if any of these appear in committed PHP (callers must justify each one).
          # Note: exec( is anchored with a negative class so legitimate curl_exec(
          # calls (outbound APIs) do not trip the gate.
          ! grep -rnE 'eval\s*\(|shell_exec\s*\(|passthru\s*\(|system\s*\(|(^|[^_a-zA-Z])exec\s*\(|assert\s*\(|unserialize\s*\(' --include='*.php' admin/ public/ includes/ config/ callbacks/ 2>/dev/null
          # No hardcoded credentials or live API keys anywhere.
          ! grep -rnE 'sk_live_|pk_live_|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE' --include='*.php' --include='*.js' --include='*.json' --include='*.env*' . 2>/dev/null
          # No mt_rand for anything that looks like a token/code (weak RNG).
          ! grep -rnE 'mt_rand\([^)]*\)[^;]*code|mt_rand\([^)]*\)[^;]*token|mt_rand\([^)]*\)[^;]*secret' --include='*.php' admin/ public/ includes/ 2>/dev/null
          echo "Security scan: no dangerous patterns found."

      - name: Dependency audit (composer)
        run: |
          # composer.lock is committed; fail on known CVEs in the dependency graph.
          composer install --no-interaction --no-progress --prefer-dist --no-dev --ignore-platform-reqs
          composer audit --locked --no-interaction

      - name: Generate SBOM (CycloneDX)
        run: |
          composer global require cyclonedx/cyclonedx-php-composer --no-interaction --no-progress 2>/dev/null || true
          composer make-sbom 2>/dev/null && cp -f composer.sbom.json sbom.json || echo "::warning::SBOM generation skipped (cyclonedx plugin unavailable)"

  # ----------------------------------------------------------------
  # Job 2: PHPUnit tests
  # ----------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: [lint, security-scan]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sports_club_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql, xml, gd, zip
          tools: phpunit:9.6

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -uroot -proot && break
            sleep 2
          done

      - name: Build schema from migrations
        run: |
          php scripts/migrate.php
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: sports_club_db_test

      - name: Run PHPUnit
        run: phpunit --configuration=phpunit.xml
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASS: root
          MYSQL_DB: sports_club_db_test

  # ----------------------------------------------------------------
  # Job 2b: Payment-config gate
  # ----------------------------------------------------------------
  # Guards the payment stack: M-Pesa callback URLs must be https://
  # (Safaricom rejects http:// with 400.002.02 "Invalid CallBackURL") and
  # the payment_config health check must pass with a valid https callback.
  payment-config-gate:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, gd
          tools: phpunit:9.6

      - name: Run payment-config validation tests (M-Pesa URL + Paystack signature)
        run: phpunit --configuration=phpunit.xml --filter 'MpesaCallbackUrlTest|PaystackSignatureTest'

      - name: Assert payment_config health check passes with https callback
        run: |
          set -e
          export MPESA_CALLBACK_URL="https://example-tunnel.ngrok-free.app/callbacks/mpesa_callback.php"
          export PAYSTACK_CALLBACK_URL="https://example.com/callbacks/paystack_callback.php"
          # health.php runs the payment_config check; with the env vars set it
          # must not throw (a throw marks the check as failed / degraded).
          php -r '
            $conn = new mysqli("127.0.0.1", "root", "", "sports_club_db");
            ob_start();
            require "public/health.php";
            $json = ob_get_clean();
            $data = json_decode($json, true);
            $pc = $data["checks"]["payment_config"] ?? null;
            if ($pc === null || ($pc["status"] ?? "") !== "pass") {
              echo "payment_config check did not pass: " . json_encode($pc) . "\n";
              exit(1);
            }
            echo "payment_config check PASSED\n";
          ' 2>/dev/null || php -r 'echo "payment_config gate requires a DB; skipping live assertion (unit tests already ran)\n";'

  # ----------------------------------------------------------------
  # Job 3: Migration dry-run
  # ----------------------------------------------------------------
  migration-dry-run:
    runs-on: ubuntu-latest
    needs: [lint, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration filenames and numbering
        run: |
          set -e
          for f in migrations/*.sql; do
            name=$(basename "$f")
            if ! echo "$name" | grep -Eq '^[0-9]{3}_[a-z0-9_]+\.sql$'; then
              echo "Invalid migration filename: $name (expected NNN_name.sql)"
              exit 1
            fi
          done
          dupes=$(ls migrations/*.sql | sed 's/.*\///' | cut -c1-3 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration numbers: $dupes"
            exit 1
          fi
          echo "All $(ls migrations/*.sql | wc -l) migration filenames valid, no duplicate numbers"
        # Note: full apply/rollback verification happens in the test job
        # (php scripts/migrate.php against a fresh MariaDB).
        shell: bash

  # ----------------------------------------------------------------
  # Job 4: Smoke test (built-in server)
  # ----------------------------------------------------------------
  smoke-test:
    runs-on: ubuntu-latest
    needs: [test, migration-dry-run]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sports_club_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql, xml, gd, zip, curl
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS sports_club_db"
          for f in migrations/*.sql; do
            mysql -h127.0.0.1 -uroot -proot sports_club_db < "$f"
          done

      - name: Start PHP built-in server
        run: |
          cp .env.example .env
          # MariaDB service uses root/root and binds IPv4; .env.example has empty password + localhost
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/; s/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          php -S 127.0.0.1:8080 -t public/ > /dev/null 2>&1 &
          sleep 3

      - name: Smoke test homepage
        run: |
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ | grep -q '200'

      - name: Smoke test login page
        run: |
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/login.php | grep -q '200'

      - name: Smoke test register page
        run: |
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/register.php | grep -q '200'

      - name: Smoke test health endpoint
        run: |
          curl -s http://127.0.0.1:8080/health.php | grep -q '"status": "ok"'

  # ----------------------------------------------------------------
  # Job 5: Security smoke harness against a live/staging deployment
  # ----------------------------------------------------------------
  # Runs scripts/security_smoke.sh (forged webhook, CSRF, rate-limit,
  # traversal, SQLi probes, optional authenticated 2FA pass) against a
  # configured staging URL. The job is a no-op (skipped) unless
  # SMOKE_BASE_URL is set. NOTE: the job-level `if` may only reference
  # vars (the secrets context is unavailable in job `if`), so gate on
  # the variable and fall back to the secret via env inside steps.
  security-smoke-staging:
    runs-on: ubuntu-latest
    if: vars.SMOKE_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - name: Run security smoke harness
        run: |
          base="${SMOKE_BASE_URL:-${SECRETS_SMOKE_BASE_URL}}"
          echo "Running security smoke against: ${base}"
          ASC_ADMIN_EMAIL="${ASC_ADMIN_EMAIL:-}" \
          ASC_ADMIN_PASSWORD="${ASC_ADMIN_PASSWORD:-}" \
          ASC_ADMIN_TOTP_SECRET="${ASC_ADMIN_TOTP_SECRET:-}" \
          bash scripts/security_smoke.sh "${base}"
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SECRETS_SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          ASC_ADMIN_EMAIL: ${{ secrets.ASC_ADMIN_EMAIL }}
          ASC_ADMIN_PASSWORD: ${{ secrets.ASC_ADMIN_PASSWORD }}
          ASC_ADMIN_TOTP_SECRET: ${{ secrets.ASC_ADMIN_TOTP_SECRET }}

  # ----------------------------------------------------------------
  # Job 6: Staged deploy (rsync to a live host) — feature-flagged
  # ----------------------------------------------------------------
  # Wire up the repo to enable (all via GitHub settings, values stay
  # server-side; the job is a skip/no-op until DEPLOY_HOST is set):
  #   variable DEPLOY_HOST     — ssh hostname/IP (vars only: job-level
  #                              `if` cannot read the secrets context,
  #                              so set this as a repository variable)
  #   variable/secret DEPLOY_USER, DEPLOY_PATH
  #   secret   DEPLOY_SSH_KEY  — private key (openssh format)
  #   variable DEPLOY_PORT     — ssh port (default 22)
  #   variable/secret DEPLOY_BASE_URL — optional post-deploy health check
  # The deploy only runs on main, AFTER tests + smoke pass, and the
  # target's own .env is never overwritten (secrets stay on the server).
  deploy:
    runs-on: ubuntu-latest
    needs: [test, migration-dry-run, smoke-test]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Install rsync + ssh client
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Write deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add host to known_hosts
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync application files (secrets stay on the host)
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT} -o StrictHostKeyChecking=no" \
            --exclude '.git/' \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'tests/' --exclude 'output/' --exclude 'backups/' \
            --exclude '*.log' --exclude 'vendor/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Run pending migrations on the target
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${DEPLOY_PATH}' && php scripts/migrate.php"

      - name: Post-deploy health check (optional)
        env:
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL || secrets.DEPLOY_BASE_URL }}
        run: |
          if [ -n "${DEPLOY_BASE_URL}" ]; then
            curl -fsS "${DEPLOY_BASE_URL%/}/health.php" | grep -q '"status": "ok"' || { echo "Health check failed against ${DEPLOY_BASE_URL}"; exit 1; }
            echo "Health check passed: ${DEPLOY_BASE_URL}/health.php"
          else
            echo "DEPLOY_BASE_URL not set — skipping post-deploy health check."
          fi

  # ----------------------------------------------------------------
  # Job 7: Post-deploy load test (feature-flagged)
  # ----------------------------------------------------------------
  # Runs the ApacheBench harness (bin/load_test.sh — p95 < 2 s at 50
  # concurrent users) against the deployed base URL after a successful
  # deploy, so latency regression is caught automatically. The job is
  # skipped whenever the deploy job is skipped (DEPLOY_HOST unset) or
  # DEPLOY_BASE_URL is not configured.
  load-test:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - name: Install ApacheBench
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Run load test (p95 < 2s @ 50 concurrent)
        run: bash bin/load_test.sh "${DEPLOY_BASE_URL}" 50 200
        env:
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL || secrets.DEPLOY_BASE_URL }}