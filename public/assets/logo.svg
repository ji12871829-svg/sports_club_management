<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Apex Sports Club">
  <title>Apex Sports Club</title>

  <!-- ══ Shield base (dark navy) ══
       Flat top edge angled slightly down from center to right;
       left side drops vertically then curves in; right side facets. -->
  <path d="M22 15 L60 12 L100 16 L104 45 Q104 70 90 86 Q78 99 60 111 Q42 99 30 86 Q16 70 16 45 Z" fill="#1c2b4f"/>

  <!-- ══ Facets ══ -->
  <!-- Upper-middle & upper-right: medium slate gray -->
  <path d="M60 12 L100 16 L104 45 Q104 58 98 68 L78 56 Q66 48 60 48 Z" fill="#4d5d83"/>
  <!-- Lower-left: slate gray -->
  <path d="M16 45 L34 47 L50 57 Q58 63 60 68 L60 111 Q42 99 30 86 Q16 70 16 45 Z" fill="#64748b"/>

  <!-- ══ Facet seams (thick white) ══ -->
  <path d="M60 12 L60 111" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <path d="M16 45 Q60 49 104 45" stroke="#ffffff" stroke-width="2.5" fill="none"/>

  <!-- ══ Running figure (solid facets, thick white separators) ══ -->
  <g stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round">
    <!-- Head: navy octagon, upper right -->
    <polygon points="66,22 75,18 84,21 87,29 85,37 76,41 67,37 64,30" fill="#1c2b4f"/>
    <!-- Torso: navy, angled forward -->
    <polygon points="62,40 88,34 84,54 60,64 56,52" fill="#1c2b4f"/>
    <!-- Front arm: bends up toward right edge, breaks the shield boundary -->
    <polygon points="70,44 94,26 112,8 99,34 80,52" fill="#1c2b4f"/>
    <!-- Back arm: sharp point down-left -->
    <polygon points="58,44 30,56 18,66 34,60 62,52" fill="#1c2b4f"/>
    <!-- Back leg: slate, strides out the bottom-left -->
    <polygon points="54,64 64,76 50,94 26,113 44,86 50,70" fill="#64748b"/>
    <!-- Front leg: navy, knee bends toward bottom center -->
    <polygon points="60,66 74,80 80,96 68,110 60,92 56,72" fill="#1c2b4f"/>
  </g>
</svg>
