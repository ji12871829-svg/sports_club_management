<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Apex Sports Club">
  <title>Apex Sports Club</title>

  <!-- ══ Shield base (dark navy) ══ -->
  <path d="M21 16 L61 11 L102 17 L106 43 Q106 68 90 84 Q78 98 61 111 Q44 98 32 84 Q14 68 14 43 Z" fill="#1c2b4f"/>

  <!-- ══ Facets ══ -->
  <!-- Upper-middle & upper-right: medium slate gray -->
  <path d="M61 11 L102 17 L106 43 Q106 60 99 72 L82 60 Q70 52 61 52 Z" fill="#4d5d83"/>
  <!-- Lower-left: slate gray -->
  <path d="M14 43 L34 46 L50 56 Q60 62 61 68 L61 111 Q44 98 32 84 Q14 68 14 43 Z" fill="#64748b"/>

  <!-- ══ Facet seams (thick white) ══ -->
  <path d="M61 11 L61 111" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <path d="M14 43 Q61 47 106 43" stroke="#ffffff" stroke-width="2.5" fill="none"/>

  <!-- ══ Running figure ══ -->
  <g stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <!-- Head: navy octagon, upper right -->
    <polygon points="70,24 79,19 87,22 89,30 87,38 79,41 71,38 68,30" fill="#1c2b4f"/>
    <!-- Torso: navy, angled forward -->
    <polygon points="66,40 89,35 85,52 62,60 58,50" fill="#1c2b4f"/>
    <!-- Front arm: bends up toward right edge, breaks the shield boundary -->
    <polygon points="72,42 92,24 112,10 97,36 78,52" fill="#1c2b4f"/>
    <!-- Back arm: sharp point down-left -->
    <polygon points="60,44 30,58 20,68 34,62 66,52" fill="#1c2b4f"/>
    <!-- Back leg: slate, strides out the bottom-left -->
    <polygon points="56,62 66,74 50,94 28,112 46,84 52,68" fill="#64748b"/>
    <!-- Front leg: navy, knee bends toward bottom center -->
    <polygon points="62,64 76,78 80,94 68,108 60,90 56,70" fill="#1c2b4f"/>
  </g>
</svg>
